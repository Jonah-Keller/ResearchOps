<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchOps</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --sunk:#eef1f5; --ink:#1d2430; --muted:#6b7688; --faint:#9aa4b4;
    --line:#e6e9ef; --accent:#3b6fd4; --accent-soft:#edf3ff; --star:#e0a91b;
    --grey:#aab2c0; --amber:#d99411; --blue:#3b6fd4; --green:#2f9e63; --red:#d1495b; --violet:#7a4fd4;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1218; --panel:#181c24; --sunk:#12151c; --ink:#e7ecf3; --muted:#8f9bb0; --faint:#5f6a7d;
          --line:#262d38; --accent:#5b8def; --accent-soft:#1c2740;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .app{display:flex;min-height:100vh}

  .side{width:236px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px;padding:14px 12px}
  .brand{font-weight:700;font-size:15px;padding:2px 8px 10px}
  .brand small{display:block;font-weight:500;color:var(--faint);font-size:11px;margin-top:2px}
  #search{margin:0 4px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13px}
  .navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:8px 10px 4px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
  .navitem:hover{background:var(--sunk)} .navitem.active{background:var(--accent-soft);color:var(--accent)}
  .navitem .n{margin-left:auto;font-weight:600;color:var(--faint);font-size:12px}.navitem.active .n{color:var(--accent)}
  .sidefoot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .toggle{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .btn{padding:8px 12px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;color:var(--accent)} .btn.sm{padding:5px 10px;font-size:12px}
  .savebadge{font-size:12px;color:var(--faint);text-align:center}
  .savebadge.dirty{color:var(--amber)} .savebadge.ok{color:var(--green)} .savebadge.err{color:var(--red)}

  main{flex:1;min-width:0;padding:18px 26px 90px;max-width:940px}
  .paste{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
  .paste summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:13px;list-style:none;color:var(--muted)}
  .paste summary::-webkit-details-marker{display:none}
  .paste .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
  textarea#pasteText{width:100%;min-height:48px;resize:vertical;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  .prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px}
  .hint{color:var(--faint);font-size:12px}
  .ppf{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--faint)}
  .ppl{font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .asst-key{margin-bottom:8px}
  .asst-results{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .asst-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
  .asst-cardtitle{font-weight:700;font-size:14px} .asst-conf{font-weight:500;font-size:11px;color:var(--faint)}
  .asst-change{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;cursor:pointer}
  .asst-change input{margin-top:2px}
  .asst-divider{text-align:center;color:var(--faint);font-size:12px;margin:18px 0 8px}
  .asst-match{font-weight:600;font-size:13px;margin-top:6px}

  .subtabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
  .subtab{padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .subtab:hover{color:var(--ink)} .subtab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .subtab .cnt{margin-left:6px;font-size:11px;color:var(--faint);font-weight:500}
  .lhead{display:flex;align-items:baseline;gap:14px;margin:2px 2px 14px;flex-wrap:wrap}
  .lhead h1{margin:0;font-size:20px}
  .lhead .stats{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
  .lhead .stats b{color:var(--ink)}

  .group{margin:0 0 4px}
  .ghead{display:flex;align-items:center;gap:9px;padding:9px 6px 7px;cursor:pointer;border-bottom:1px solid var(--line)}
  .ghead .caret{color:var(--faint);font-size:11px;width:10px;transition:transform .12s}
  .ghead.collapsed .caret{transform:rotate(-90deg)}
  .ghead .gname{font-weight:700;font-size:13.5px}
  .ghead .gmeta{color:var(--faint);font-size:12px;margin-left:auto;display:flex;gap:8px;align-items:center}
  .fundchip{font-size:11px;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent);padding:1px 8px;border-radius:20px;font-weight:600}

  .substage{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 6px 3px 22px}
  .substage .ssdot{width:7px;height:7px;border-radius:50%;flex:none}
  .substage .cnt{color:var(--faint);font-weight:500}
  .prow2{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .prow2:hover{background:var(--panel)} .prow2.open{background:var(--panel)}
  .prow2[draggable=true]{cursor:grab}
  .prow2.dragover{box-shadow:inset 0 2px 0 var(--accent)}
  .ghead.dragover{background:var(--accent-soft);border-radius:8px}
  .navitem.dragover{background:var(--accent-soft);outline:1px dashed var(--accent)}
  .grouped .prow2{padding-left:22px}
  .star{border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--faint);padding:0;line-height:1;flex:none}
  .star.on{color:var(--star)}
  .rmain{flex:1;min-width:0}
  .rname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;border-bottom:1px dashed transparent}
  .rname:hover{border-bottom-color:var(--faint)}
  .rnameinput{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;width:100%;background:var(--bg);color:var(--ink)}
  .archived .rname{color:var(--muted)}
  .gmwrap{padding:0 6px 4px} .gmsel{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px}
  .ctxmenu{position:fixed;z-index:100;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px rgba(15,20,35,.22);min-width:190px;padding:5px}
  .ctxlbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:5px 12px 3px;font-weight:700}
  .ctxitem{padding:7px 12px;cursor:pointer;border-radius:6px;font-size:13px}
  .ctxitem:hover{background:var(--sunk)} .ctxitem.cur{color:var(--accent);font-weight:600}
  .ctxitem.danger{color:var(--red)} .ctxitem.danger:hover{background:var(--red);color:#fff}
  .ctxsep{height:1px;background:var(--line);margin:5px 4px}
  .rsub{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rsub .sdot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:1px;margin-right:4px}
  .rsub .sep{color:var(--faint);margin:0 5px}
  .countbadge{font-size:11px;color:var(--faint);flex:none;min-width:44px;text-align:right}
  .rcaret{color:var(--faint);font-size:11px;flex:none;width:12px;text-align:center;transition:transform .12s}
  .prow2.open .rcaret{transform:rotate(90deg)}

  .detail{border-bottom:1px solid var(--line);background:var(--panel);padding:6px 16px 16px 22px}
  .seclbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--faint);margin:15px 0 6px}
  .kvrow{display:flex;gap:10px;align-items:baseline;padding:3px 0}
  .kvrow .k{color:var(--faint);font-size:12px;min-width:88px;flex:none}
  .kvrow .v{font-size:13px}
  .editable{cursor:pointer;border-bottom:1px dashed transparent;padding:1px 3px;border-radius:5px}
  .editable:hover{border-bottom-color:var(--faint);background:var(--sunk)}
  .editable.empty{color:var(--faint);font-style:italic}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;color:#fff}
  .pill.empty{background:transparent;border:1px dashed var(--line);color:var(--faint);font-weight:600;font-style:normal}
  .inlineinput,.inlinesel{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--bg);color:var(--ink)}
  .inlinearea{display:block;width:100%;min-width:280px;min-height:52px;resize:vertical;line-height:1.5;text-align:left}

  .pcard{border:1px solid var(--line);border-radius:9px;padding:8px 30px 8px 11px;margin:5px 0;position:relative;background:var(--bg)}
  .pfields{display:flex;flex-wrap:wrap;gap:5px 18px}
  .kvi{font-size:12px;color:var(--ink)} .kvi .k{color:var(--faint);margin-right:5px;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .pnote{margin-top:5px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
  .pnote .k{color:var(--faint);font-size:11px;text-transform:uppercase}
  .pcard>.x{position:absolute;top:7px;right:9px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px}
  .pcard>.x:hover{color:var(--red)}
  .preslbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin:6px 0 2px}
  .presrow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
  .presrow>.x{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px}.presrow>.x:hover{color:var(--red)}
  .entries{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .entry{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;position:relative}
  .etitle{font-weight:700;font-size:15px} .emeta{display:flex;gap:6px 20px;flex-wrap:wrap;margin:5px 0 3px}
  .enote{font-size:12px;color:var(--muted)} .enote .k{color:var(--faint);font-size:11px;text-transform:uppercase}
  .entry>.del{position:absolute;top:9px;right:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}
  .entry>.del:hover{color:#fff;background:var(--red);border-color:var(--red)}
  .grants{display:flex;flex-direction:column;gap:8px;margin:4px 0 8px}
  .grantcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 13px;position:relative}
  .grantcard>.x{position:absolute;top:8px;right:9px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px}.grantcard>.x:hover{color:var(--red)}

  .worktrack{margin:7px 0}
  .whead{display:flex;align-items:center;gap:9px}
  .wtitle{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize;min-width:70px}
  .tasks{display:flex;flex-direction:column;gap:1px;margin:3px 0 0 2px}
  .task{display:flex;align-items:baseline;gap:7px;padding:2px 0;border-radius:6px}
  .task:hover{background:var(--sunk)}
  .task input[type=checkbox]{accent-color:var(--green);cursor:pointer;flex:none;align-self:flex-start;margin-top:3px}
  .task .body{flex:1;min-width:0;cursor:text}
  .task .who{color:var(--accent);font-weight:700}
  .task.done .body{text-decoration:line-through;color:var(--faint)}
  .task .x{visibility:hidden;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;flex:none}
  .task:hover .x{visibility:visible} .task .x:hover{color:var(--red)}
  .task .tcaret{color:var(--faint);font-size:10px;flex:none;transition:transform .12s;align-self:center}
  .task .tcaret.open{transform:rotate(90deg)}
  .task .mini{font-size:10.5px;color:var(--faint);margin-left:6px}
  .taskdetail{margin:2px 0 8px 22px;border-left:2px solid var(--accent-soft);padding:6px 0 4px 12px;display:flex;flex-direction:column;gap:9px}
  .tdflags{display:flex;gap:18px;flex-wrap:wrap} .tdflag{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
  .tdrow{display:flex;flex-direction:column;gap:3px}
  .tdlbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
  .tdinput{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:5px 8px}
  .tdarea{width:100%;min-height:46px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:6px 8px}
  .linkrow,.subtask{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:1px 0}
  .linkrow a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .linkrow a:hover{text-decoration:underline}
  .subtask.done .editable{text-decoration:line-through;color:var(--faint)}
  .subtask .editable{flex:1}
  .node .nodeadd{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px;font-weight:700;line-height:1}
  .node .nodeadd:hover{color:var(--accent)}
  .nodekids{margin-left:15px;border-left:1px solid var(--line);padding-left:8px}
  .linkrow .x,.subtask .x{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:12px}
  .linkrow .x:hover,.subtask .x:hover{color:var(--red)}
  .subtask input[type=checkbox]{accent-color:var(--green)}
  /* --- Asana tasks: priority + due + nested first-class subtasks --- */
  .prio{font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:20px;color:#fff;flex:none;align-self:center;text-transform:uppercase}
  .prio-high{background:var(--red)} .prio-med{background:var(--amber)} .prio-low{background:var(--blue)}
  .duebadge{font-size:10.5px;font-weight:700;margin-left:7px;padding:0 6px;border-radius:20px;white-space:nowrap}
  .duebadge.due-over{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
  .duebadge.due-soon{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .duebadge.due-ok{background:var(--sunk);color:var(--faint)}
  .task.sub{margin-left:2px}
  .taskdetail .tdgrid{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .taskdetail .tdgrid .tdrow{min-width:120px}
  .tddate{border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;padding:4px 7px}
  .subtree{display:flex;flex-direction:column;margin-left:2px;border-left:1px solid var(--line);padding-left:9px}
  .subtree .taskdetail{margin-left:16px}
  /* --- Due-soon view --- */
  .duegroup{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--faint);margin:16px 0 6px}
  .duerow{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;background:var(--panel)}
  .duerow:hover{border-color:var(--accent)}
  .duerow .dtext{flex:1;min-width:0;font-size:13px}
  .duerow .dproj{font-size:11px;color:var(--faint);flex:none;background:var(--sunk);padding:1px 8px;border-radius:20px}
  .duesub{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px 2px}
  /* quick capture + inbox rows */
  .qcap{display:flex;flex-direction:column;gap:3px;margin:6px 0 12px}
  .qcap-in{width:100%;box-sizing:border-box;font-size:14px;padding:11px 13px;border:1.5px solid var(--accent);border-radius:10px;background:var(--panel);color:var(--fg)}
  .qcap-in::placeholder{color:var(--faint)}
  .qcap-in:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .qcap-hint{font-size:11px;color:var(--faint);padding-left:3px}
  .duerow.inboxrow{cursor:default}
  .duerow.inboxrow:hover{border-color:var(--line)}
  .duerow .duechk{flex:none;width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
  .duerow .dedit{cursor:text}
  .duerow .dprio{flex:none}
  .duerow .dduedate{flex:none;font-size:11px;color:var(--faint);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px 5px}
  .duerow .dproj.inboxtag{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .duerow .x{flex:none;border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
  .duerow .x:hover{color:var(--red)}
  .duewrap{margin-bottom:5px}
  .duewrap .duerow{margin-bottom:0}
  .dcaret{color:var(--faint);margin-right:7px;font-size:11px}
  .dueexp{border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;background:var(--sunk);padding:10px 12px 11px;margin:-1px 0 0}
  .dexp-notes{font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-bottom:8px}
  .dexp-meta{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px}
  .dexp-kv{display:flex;align-items:center;gap:6px;font-size:12px}
  .dexp-k{color:var(--faint);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
  .dexp-subs{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
  .dexp-sub{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .dexp-sub input{accent-color:var(--accent)}
  .dexp-subdone{text-decoration:line-through;color:var(--faint)}
  .dexp-open{font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer}
  .dexp-open:hover{border-color:var(--accent);color:var(--accent)}
  /* --- Specimen tracker --- */
  .specnav{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flowbanner{font-size:12px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0;line-height:1.6}
  .flowbanner b{color:var(--ink)} .flowbanner em{font-style:normal;font-weight:700;color:var(--accent)}
  .flowbanner .pos{color:var(--green);font-weight:600} .flowbanner .neg{color:var(--violet);font-weight:600} .flowbanner .spa{color:var(--blue);font-weight:600}
  .specsum{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .sumchip{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 11px} .sumchip b{color:var(--ink);font-size:13px}
  .specfilters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px} .specfilters .gmsel{width:auto;min-width:130px}
  .specgrp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--faint);margin:16px 0 6px}
  .specgrp-tog{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px}
  .specgrp-tog:hover{background:var(--sunk)} .specgrp-tog .gcar{font-size:10px;width:10px} .specgrp-tog .gc{background:var(--sunk);color:var(--muted);border-radius:20px;padding:0 8px;font-size:11px;font-weight:700}
  .specrow .clin.embolized{color:var(--red)}
  .spectable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  .specrowwrap{border-bottom:1px solid var(--line);min-width:820px} .specrowwrap:last-child{border-bottom:none}

  .cv-presmeta{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-left:16px;color:var(--muted);font-size:12px;padding:1px 0}
  .cv-presmeta .sep{color:var(--faint)}
  .cv-distinction,.cv-distinction .editable{font-style:italic}
  .cv-venuex{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;visibility:hidden}
  .cv-presmeta:hover .cv-venuex{visibility:visible} .cv-venuex:hover{color:var(--red)}
  .cv-addvenue{margin-left:16px}
  .cv-links{margin-top:4px}
  .cv-chips{display:flex;gap:6px;flex-wrap:wrap;margin:3px 0 1px}

  .cv-eye:hover{border-color:var(--accent);color:var(--accent)}

  .cv-sec.cv-hidden > :not(.cv-h2wrap){opacity:.38}

  @media print{
    @page{margin:0.55in}
    html,body{background:#fff;color:#000;font-size:10.5pt}
    .side,.cvbar,.miss,.cv-eye{display:none!important}
    .cv-sec.cv-hidden{display:none!important}
    main{max-width:none;padding:0}
    .cv{border:none;border-radius:0;padding:0;max-width:none;background:#fff}
    /* continuous flow — no forced/avoided page breaks */

    .cv-h2,.cv-h3{break-after:avoid;page-break-after:avoid}

    .editable{border:none!important;background:none!important}
    .lnkedit,.cv-add,.cv-del,.cv-chips,.cv-chip,.cv-venuex{display:none!important}
    .cv-kv.empty,.cv-sub.empty,.cv-desc.empty,.cv-para.empty,.cv-block2.empty,.cv-date.empty,.editable.empty{display:none!important}
    .paste{display:none!important}
  }
  @media(max-width:720px){.app{flex-direction:column}.side{position:static;height:auto;width:100%}.miss ul{columns:1}}
</style>

<body>
<div class="app"><aside class="side" id="side"></aside><main id="main"></main></div>
<datalist id="journals"></datalist>
<datalist id="confs"></datalist>

<dialog id="newProjDlg"><form method="dialog" class="dlg">

  <input id="npPI" placeholder="PI (optional)">
  <div class="row"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Create</button></div>
</form></dialog>

<script>
const TRACK_STATUS={
  funding:["","needed","applied","awarded"], data:["","needed","collecting","acquired"],
  analysis:["","planned","in-progress","complete"], paper:["","idea","in-prep","feedback","in-submission","in-review","accepted","published"]};
const POSTER_STATUS=["","idea","planned","submitted","accepted","presented"];
const PTYPES=["Poster","Oral Presentation","Poster + Oral","Abstract"];
const SC={"":"var(--grey)",idea:"var(--grey)",needed:"var(--amber)",planned:"var(--amber)","in-prep":"var(--amber)",
  feedback:"var(--violet)",applied:"var(--blue)",collecting:"var(--blue)","in-progress":"var(--blue)",submitted:"var(--blue)","in-submission":"var(--blue)","in-review":"var(--blue)",
  awarded:"var(--green)",acquired:"var(--green)",complete:"var(--green)",accepted:"var(--green)",presented:"var(--green)",published:"var(--green)"};
const AUTH=["","first","co-first","second","third","middle"];
const AUTH_LBL={first:"1st author","co-first":"Co-1st author",second:"2nd author",third:"3rd author",middle:"Middle author","":"set authorship"};
const AUTH_SHORT={first:"1st","co-first":"Co-1st",second:"2nd",third:"3rd",middle:"Middle","":""};
const WORK=["funding","data","analysis"];
const JOURNALS=["Nature","Nature Medicine","Nature Neuroscience","Nature Aging","Nature Cardiovascular Research","Nature Cardiovascular Medicine","Nature Reviews Neurology","Science","Cell","Cell Reports","Circulation","JACC","JACC Advances","JAMA","JAMA Neurology","JAMA Cardiology","JAMA Ophthalmology","JAMA Network Open","Ophthalmology","Immunity","Alzheimer's & Dementia","Neurology","Annals of Neurology","JNS","JNIS","AJNR","Neurosurgery","World Neurosurgery","Journal of Neuro-oncology"];
const JABBR={"Nature":"Nature","Nature Medicine":"Nat Med","Nature Neuroscience":"Nat Neurosci","Nature Aging":"Nat Aging","Nature Cardiovascular Research":"Nat Cardiovasc Res","Nature Cardiovascular Medicine":"Nat Cardiovasc Med","Nature Reviews Neurology":"Nat Rev Neurol","Science":"Science","Cell":"Cell","Cell Reports":"Cell Rep","Circulation":"Circulation","JACC":"J Am Coll Cardiol","JACC Advances":"JACC Adv","JAMA":"JAMA","JAMA Neurology":"JAMA Neurol","JAMA Cardiology":"JAMA Cardiol","JAMA Ophthalmology":"JAMA Ophthalmol","JAMA Network Open":"JAMA Netw Open","Ophthalmology":"Ophthalmology","Immunity":"Immunity","Alzheimer's & Dementia":"Alzheimers Dement","Neurology":"Neurology","Annals of Neurology":"Ann Neurol","JNS":"J Neurosurg","Journal of Neurosurgery":"J Neurosurg","JNIS":"J Neurointerv Surg","AJNR":"AJNR Am J Neuroradiol","Neurosurgery":"Neurosurgery","World Neurosurgery":"World Neurosurg","Journal of Neuro-oncology":"J Neurooncol"};
const CONFS=["AAIC","AAN","CNS","SVIN","CureHHT"];
const TK={
  funding:["fund","grant","r01","k99","foundation","scholarship","award","budget","money","samvid","guggenheim","couch","eyebank"],
  data:["data","sample","collect","acquire","cohort","download","trinetx","biobank","tissue","lines","fastq","cosmx","ihc","sorting"],
  analysis:["analysis","analyze","model","statistic","figure","fig ","rnaseq","deg","spatial","scrnaseq","pipeline","staining","elisa","segmentation","proteomic","variant"],
  paper:["paper","manuscript","submit","revision","reviewer","review","journal","resubmit","draft","supplementary","text","rebuttal","nature","jama","jnis","jns","ajnr","cell","accepted","rejected"]};

let DATA=null, activeLab=null, curQ='';
const expanded=new Set(), collapsedGroups=new Set(), expandedTasks=new Set(), revealedWork=new Set(), expandedOmics=new Set();
let hideCompleted=true, showArchived=false, saveTimer=null, pendingFocusId=null, dragId=null, omicsDrag=null, groupMode='program', subMode='', labView='research', dataMtime=null;
const CLERICAL_STATUS=["todo","in progress","submitted","approved","done"];
const CLERICAL_COLOR={todo:"var(--amber)","in progress":"var(--blue)",submitted:"var(--blue)",approved:"var(--green)",done:"var(--green)"};
const DATASETS=["UKB","AoU","TriNetX","UPTEMPO","BioMe","PMBB","CHOP","iPSC","Brain tissue","CSF","scRNAseq","Spatial"];
const STAGE_ORDER=["idea","data-collection","analysis","manuscript-prep","ready-for-feedback","responding-to-feedback","prepared-for-submission","in-submission","in-review","in-revision","rejected","accepted"];
const STAGE_LBL={idea:"Idea","data-collection":"Data Collection",analysis:"Analysis","manuscript-prep":"Manuscript Preparation","ready-for-feedback":"Ready for Feedback","responding-to-feedback":"Responding to Feedback","prepared-for-submission":"Prepared for Submission","in-submission":"In Submission","in-review":"In Review","in-revision":"In Revision",rejected:"Rejected",accepted:"Accepted"};
const STAGE_COLOR={idea:"var(--grey)","data-collection":"var(--grey)",analysis:"var(--amber)","manuscript-prep":"var(--amber)","ready-for-feedback":"var(--violet)","responding-to-feedback":"var(--violet)","prepared-for-submission":"var(--blue)","in-submission":"var(--blue)","in-review":"var(--blue)","in-revision":"var(--blue)",rejected:"var(--red)",accepted:"var(--green)"};
const stageOf=p=>p.stage||"idea";
const isActive=p=>!["accepted","rejected"].includes(stageOf(p));
const CV_SECTIONS=["Education","Experience","Activities","Funding / Scholarship","Peer Review Activity"];
const CV_SECTION_LABEL={"Education":"Education","Experience":"Experience","Activities":"Leadership & Service","Funding / Scholarship":"Honors & Awards","Peer Review Activity":"Peer Review"};
const GRANT_STATUS=["planning","applying","submitted","under review","awarded","rejected","not eligible"];
const GRANT_COLOR={planning:"var(--grey)",applying:"var(--amber)",submitted:"var(--blue)","under review":"var(--blue)",awarded:"var(--green)",rejected:"var(--red)","not eligible":"var(--faint)"};
const PRES_STATUS=["","planned","submitted","accepted","presented","rejected"];
const PRES_STATUS_LBL={'':'—',planned:'Planned',submitted:'Submitted',accepted:'Accepted',presented:'Presented',rejected:'Rejected'};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const optn=(v,t)=>{const o=el('option',null,t);o.value=v;return o;};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const myName=()=>((DATA&&DATA.profile&&DATA.profile.name)||'');
// Which lab (if any) shows the multi-omics planning board. Set in flags, not in code.
const omicsLab=()=>((DATA&&DATA.flags&&DATA.flags.omicsLab)||'');
// "Is this me?" — everything that used to hardcode a name derives from profile.name.
const rxEsc=t=>String(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const myNameParts=()=>myName().trim().split(/\s+/).filter(Boolean);
function meRe(loose){
  const p=myNameParts(); if(!p.length) return null;
  const inits=p.map(x=>x[0]).filter(c=>/[A-Za-z]/.test(c)).join('');
  const alts=[p[p.length-1],p[0]].concat(loose?[inits,'me']:[]);
  return new RegExp('\\b('+alts.filter(Boolean).map(rxEsc).join('|')+')\\b','i');
}
const isMeName =s=>{const r=meRe();     return !!r&&r.test(s||'');};  // author lists
const isMeOwner=s=>{const r=meRe(true); return !r||r.test(s||'');};   // owner fields; no name set → assume mine
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function boot(){ const r=await fetch('/api/data'); dataMtime=r.headers.get('X-Data-Mtime'); DATA=await r.json();
  normalizeData();
  collapsedGroups.add('tail:accepted'); collapsedGroups.add('tail:rejected');
  // Fresh workspace (no projects yet) → open on the CV, which is where you start.
  activeLab=(DATA.projects&&DATA.projects.length)?DATA.labs[0]:'__cv__';
  buildDatalists(); render(); }
function migTask(it){
  if(it.owner===undefined)it.owner='';
  if(it.date===undefined)it.date='';
  if(it.due===undefined)it.due='';
  if(it.priority===undefined)it.priority=it.hp?'high':'';
  if(it.notes===undefined)it.notes='';
  if(!Array.isArray(it.links))it.links=[];
  if(it.children&&!it.subtasks){it.subtasks=it.children;delete it.children;}
  if(!Array.isArray(it.subtasks))it.subtasks=[];
  it.subtasks.forEach(migTask);
}
function normalizeData(){ if(!DATA.groups)DATA.groups=[]; if(!DATA.entries)DATA.entries=[]; if(!DATA.grants)DATA.grants=[]; if(!DATA.clerical)DATA.clerical=[]; if(!DATA.specimens)DATA.specimens=[]; if(!DATA.profile)DATA.profile={}; if(!DATA.flags)DATA.flags={}; DATA.omics = (!DATA.omics||(DATA.omics.v||0)<6) ? defaultOmics() : migrateOmics(DATA.omics);
  DATA.projects.forEach(p=>Object.values(p.tracks).forEach(tr=>(tr.items||[]).forEach(migTask))); }
async function reloadFresh(){ const r=await fetch('/api/data'); dataMtime=r.headers.get('X-Data-Mtime'); DATA=await r.json(); normalizeData(); render(); }
boot();
function buildDatalists(){
  const js=new Set(JOURNALS), cs=new Set(CONFS);
  DATA.projects.forEach(p=>{ if(p.tracks.paper?.journal)js.add(p.tracks.paper.journal); (p.posters||[]).forEach(ps=>ps.conference&&cs.add(ps.conference)); });
  const fill=(id,set)=>{const dl=$('#'+id); dl.innerHTML=''; [...set].sort().forEach(v=>dl.appendChild(optn(v,v)));};
  fill('journals',js); fill('confs',cs);
}

const projectsIn=(lab,g)=>DATA.projects.filter(p=>p.lab===lab && (g===undefined||(p.group||'')===g));
const groupsIn=lab=>DATA.groups.filter(g=>g.lab===lab);
const labCount=lab=>CV_SECTIONS.includes(lab)?DATA.entries.filter(e=>e.section===lab).length:projectsIn(lab).filter(isActive).length;
const prioSort=(a,b)=>(b.priority||0)-(a.priority||0)||a.name.localeCompare(b.name);
const openCount=p=>Object.values(p.tracks).reduce((n,tr)=>n+(tr.items||[]).filter(i=>!i.done).length,0);
const journalOf=p=>(p.tracks.paper||{}).journal||'';

function render(){ renderSide(); renderMain(); }

function renderSide(){
  const s=$('#side'); s.innerHTML='';
  const b=el('div','brand','ResearchOps'); b.appendChild(el('small',null,(DATA.profile&&DATA.profile.name?DATA.profile.name+' · ':'')+(DATA.updated?('saved '+DATA.updated):''))); s.appendChild(b);
  const srch=el('input'); srch.id='search'; srch.placeholder='Filter…'; srch.value=curQ;
  srch.addEventListener('input',e=>{curQ=e.target.value; renderMain();}); s.appendChild(srch);
  const cvIt=el('div','navitem'+(activeLab==='__cv__'?' active':'')); cvIt.appendChild(el('span',null,'📄 Curriculum Vitae'));
  cvIt.onclick=()=>{activeLab='__cv__'; render();}; s.appendChild(cvIt);
  const asIt=el('div','navitem'+(activeLab==='__assistant__'?' active':'')); asIt.appendChild(el('span',null,'✨ Update Assistant'));
  const asBadge=el('span','n'); asIt.appendChild(asBadge);
  fetch('/api/pending').then(r=>r.json()).then(items=>{ if(items&&items.length){ asBadge.textContent=items.length; asBadge.style.background='var(--amber)'; asBadge.style.color='#fff'; asBadge.style.borderRadius='10px'; asBadge.style.padding='0 6px'; } }).catch(()=>{});
  asIt.onclick=()=>{activeLab='__assistant__'; render();}; s.appendChild(asIt);
  // Wet-lab specimen tracker — only relevant to workspaces that bank tissue.
  // Shows once there are specimens, or when flags.specimens is turned on.
  if((DATA.specimens||[]).length||(DATA.flags||{}).specimens){
    const spIt=el('div','navitem'+(activeLab==='__specimens__'?' active':'')); spIt.appendChild(el('span',null,'🧫 Specimens'));
    spIt.appendChild(el('span','n',String((DATA.specimens||[]).length))); spIt.onclick=()=>{activeLab='__specimens__'; render();}; s.appendChild(spIt);
  }
  const dueIt=el('div','navitem'+(activeLab==='__due__'?' active':'')); dueIt.appendChild(el('span',null,'⏰ My tasks'));
  const overN=dueCount(); if(overN){ const db=el('span','n'); db.textContent=overN; db.style.background='var(--red)'; db.style.color='#fff'; db.style.borderRadius='10px'; db.style.padding='0 6px'; dueIt.appendChild(db); }
  dueIt.onclick=()=>{activeLab='__due__'; render();}; s.appendChild(dueIt);
  s.appendChild(el('div','navlbl','Labs'));
  DATA.labs.filter(l=>!CV_SECTIONS.includes(l)).forEach(lab=>{ const it=el('div','navitem'+(lab===activeLab?' active':''));
    it.appendChild(el('span',null,lab)); it.appendChild(el('span','n',String(labCount(lab))));
    it.onclick=()=>{activeLab=lab; labView='research'; render();};
    it.ondragover=e=>{ if(dragId){e.preventDefault(); it.classList.add('dragover');} };
    it.ondragleave=()=>it.classList.remove('dragover');
    it.ondrop=e=>{ e.preventDefault(); it.classList.remove('dragover'); if(dragId){ moveProject(dragId,null,lab,''); activeLab=lab; } };
    s.appendChild(it); });
  s.appendChild(el('div','navlbl','CV Sections'));
  CV_SECTIONS.forEach(sec=>{ const it=el('div','navitem'+(sec===activeLab?' active':''));
    it.appendChild(el('span',null,CV_SECTION_LABEL[sec]||sec)); it.appendChild(el('span','n',String(labCount(sec))));
    it.onclick=()=>{activeLab=sec; render();}; s.appendChild(it); });
  s.appendChild(el('div','navlbl','Group by'));
  const gmw=el('div','gmwrap'); const gm=el('select','gmsel');
  [['program','Program'],['dataset','Dataset'],['status','Status']].forEach(([v,l])=>gm.appendChild(optn(v,l)));
  gm.value=groupMode; gm.onchange=()=>{groupMode=gm.value; renderMain();}; gmw.appendChild(gm); s.appendChild(gmw);
  const smw=el('div','gmwrap'); const sm=el('select','gmsel');
  [['','then by… (none)'],['status','then by Status'],['dataset','then by Dataset']].forEach(([v,l])=>sm.appendChild(optn(v,l)));
  sm.value=subMode; sm.onchange=()=>{subMode=sm.value; renderMain();}; smw.appendChild(sm); s.appendChild(smw);
  const foot=el('div','sidefoot');
  foot.appendChild(mkToggle('Hide completed tasks',hideCompleted,v=>{hideCompleted=v; renderMain();}));
  const rb=el('button','btn ghost sm','📄 Weekly report'); rb.onclick=()=>window.open('/report?lab='+encodeURIComponent(activeLab),'_blank'); foot.appendChild(rb);
  const sb=el('div','savebadge','saved'); sb.id='savebadge'; foot.appendChild(sb); s.appendChild(foot);
}
function mkToggle(label,val,cb){ const w=el('label','toggle'); const c=el('input'); c.type='checkbox'; c.checked=val;
  c.onchange=()=>cb(c.checked); w.appendChild(c); w.appendChild(el('span',null,label)); return w; }

function matches(p){ if(!curQ)return true; const q=curQ.toLowerCase();
  const hay=(p.name+' '+(p.authorship||'')+' '+(p.pi||[]).join(' ')+' '+(p.tags||[]).join(' ')+' '+journalOf(p)+' '+(p.dataset||'')+' '+
    (p.posters||[]).map(x=>(x.note||'')+' '+(x.presentations||[]).map(pr=>pr.conference).join(' ')).join(' ')+' '+
    Object.values(p.tracks).flatMap(t=>(t.items||[]).map(i=>i.owner+' '+i.text)).join(' ')).toLowerCase();
  return hay.includes(q); }
function labStats(lab){ let prio=0,acc=0,open=0;
  projectsIn(lab).forEach(p=>{ if(!isActive(p))return; if(p.priority)prio++;
    if(['accepted','published'].includes((p.tracks.paper||{}).status))acc++;
    (p.posters||[]).forEach(x=>{if((x.presentations||[]).some(pr=>['accepted','presented'].includes(pr.status)))acc++;});
    Object.values(p.tracks).forEach(tr=>{(tr.items||[]).forEach(i=>{if(!i.done)open++;});});});
  return {prio,acc,open}; }

function renderMain(){
  const m=$('#main'); m.innerHTML='';
  if(activeLab==='__cv__'){ renderCV(m); return; }
  if(activeLab==='__assistant__'){ renderAssistant(m); return; }
  if(activeLab==='__specimens__'){ renderSpecimens(m); return; }
  if(activeLab==='__due__'){ renderDue(m); return; }
  if(CV_SECTIONS.includes(activeLab)){ renderCVSection(m); return; }
  renderLabTabs(m);
  if(labView==='omics'){ if(omicsLab()&&activeLab===omicsLab()){ renderOmicsPlan(m); return; } labView='research'; }
  if(labView==='clerical'){ renderClerical(m); return; }
  if(labView==='funding'){ renderFundingTab(m); return; }
  const pap=el('details','paste');
  pap.innerHTML=`<summary>＋ Paste a paper / submission</summary><div class="body">
    <textarea id="paperText" placeholder="Paste a citation or paper info — authors, title, journal, status (e.g. 'Doe JR, … Lee AM. Plasma NfL and cardiovascular outcomes. Under review at JACC.')"></textarea>
    <div class="prow"><button class="btn sm" id="paperMatch">Match →</button>
      <select id="paperTarget"></select>
      <button class="btn sm" id="paperApply">Add / Update</button><span class="hint" id="paperWhy"></span></div>
    <div id="paperFields" class="prow" style="display:none;gap:10px 14px"></div></div>`;
  m.appendChild(pap); wirePaperPaste();

  const det=el('details','paste');
  det.innerHTML=`<summary>＋ Paste a task</summary><div class="body">
    <textarea id="pasteText" placeholder="e.g. 'Ben to finish gcSVD supplementary tables' (one per line)"></textarea>
    <div class="prow"><button class="btn sm" id="suggestBtn">Suggest →</button>
      <select id="pasteProject"></select><select id="pasteTrack"></select>
      <button class="btn sm" id="addTaskBtn">Add</button><span class="hint" id="pasteWhy"></span></div></div>`;
  m.appendChild(det); wirePaste();
  renderLabProfile(m, activeLab);

  const s=labStats(activeLab); const h=el('div','lhead');
  h.innerHTML=`<h1>${activeLab}</h1><div class="stats"><span><b>${labCount(activeLab)}</b> active</span>
    <span><b>${s.prio}</b>★</span><span><b>${s.acc}</b> accepted/awarded</span><span><b>${s.open}</b> open tasks</span></div>`;
  m.appendChild(h);

  if(groupMode==='program') renderProgram(m);
  else if(groupMode==='dataset') renderByField(m,'dataset');
  else renderByStatus(m);
  const ap=el('div','addproj'); const b=el('button','btn ghost sm','+ New project'); b.onclick=openNewProj; ap.appendChild(b);
  const gp=el('button','btn ghost sm','+ New program'); gp.onclick=()=>{ const name=(prompt('New program name (grouping under '+activeLab+'):')||'').trim(); if(!name)return;
    const id=slug(name)+'-'+Math.abs(hash(name+(_pc++))).toString(36).slice(0,4);
    const g={id,name,lab:activeLab,tags:[]}; g.tracks={}; DATA.tracks.forEach(t=>g.tracks[t]={status:'',items:[]});
    DATA.groups.push(g); groupMode='program'; queueSave(); render(); }; ap.appendChild(gp);
  m.appendChild(ap);
  if(pendingFocusId){ const e=document.getElementById(pendingFocusId); if(e){e.focus(); e.scrollIntoView({block:'center'});} pendingFocusId=null; }
}

function renderCVSection(m){
  const es=DATA.entries.filter(e=>e.section===activeLab);
  const h=el('div','lhead'); h.innerHTML=`<h1>${CV_SECTION_LABEL[activeLab]||activeLab}</h1><div class="stats"><span><b>${es.length}</b> entries</span> <span>· edit these inline on the <b>Curriculum Vitae</b> tab too</span></div>`; m.appendChild(h);
  const list=el('div','entries'); es.forEach(e=>list.appendChild(renderEntry(e))); m.appendChild(list);
  const aw=el('div','addproj'); const b=el('button','btn ghost sm','+ Add entry');
  b.onclick=()=>{ DATA.entries.push({id:'e'+Math.abs(hash('e'+(_pc++))),section:activeLab,title:'',org:'',amount:'',date:'',note:''}); queueSave(); renderMain(); };
  aw.appendChild(b); m.appendChild(aw);
}
function renderEntry(e){
  const s=e.section, isFund=s.startsWith('Funding');
  const orgLbl = isFund?'Sponsor' : s==='Peer Review Activity'?'Role' : s==='Education'?'Degree' : s==='Experience'?'Organization' : 'Role';
  const titlePh = isFund?'award / scholarship' : s==='Education'?'institution' : s==='Experience'?'position' : 'title';
  const c=el('div','entry');
  const t=el('div','etitle'); t.appendChild(editText(()=>e.title,v=>e.title=v,{ph:titlePh})); c.appendChild(t);

const OMICS_V=8;
function defaultOmics(){ return { v:OMICS_V, gate:null, arms:[], figures:[] }; }
const OSTAT=['plan','prog','done','gap'];
const OMAP={done:{ic:'✓',l:'Done',c:'p-done'},prog:{ic:'◐',l:'In progress',c:'p-prog'},plan:{ic:'○',l:'Planned',c:'p-plan'},gap:{ic:'⚠',l:'Gap / needed',c:'p-gap'}};
const ocycle=v=>OSTAT[(OSTAT.indexOf(v||'plan')+1)%OSTAT.length];
function ostatPill(get,set){ const p=el('span','opill'); const paint=()=>{const mm=OMAP[get()||'plan']; p.className='opill '+mm.c; p.textContent=mm.ic+' '+mm.l;}; paint();
  p.onclick=e=>{e.stopPropagation(); set(ocycle(get())); queueSave(); renderMain();}; return p; }
function omicsComp(filt){ const a=(DATA.specimens||[]).filter(s=>(s.kind||'avm')==='avm'&&filt(s));
  return {n:a.length,d:a.filter(s=>s.geno==='KRAS G12D').length,v:a.filter(s=>s.geno==='KRAS G12V').length,pn:a.filter(s=>s.geno==='panel-negative').length,ne:a.filter(s=>s.embolized==='no').length}; }
function migrateOmics(O){
  if(!O) return defaultOmics();
  if(O.gate){ if(!O.gate.id)O.gate.id='gate'; if(!O.gate.public)O.gate.public=[]; if(!O.gate.tasks)O.gate.tasks=[]; }
  if(!Array.isArray(O.arms))O.arms=[];
  O.arms.forEach(a=>{ if(!Array.isArray(a.steps))a.steps=[];
    a.steps.forEach(st=>{ if(!Array.isArray(st.public))st.public=[]; if(!Array.isArray(st.tasks))st.tasks=[]; }); });
  if(!Array.isArray(O.figures))O.figures=[];
  O.v=OMICS_V; return O;
}
function moveOmics(fromArr,obj,toArr,beforeObj){
  const i=fromArr.indexOf(obj); if(i<0)return; fromArr.splice(i,1);
  const j=beforeObj?toArr.indexOf(beforeObj):-1; toArr.splice(j<0?toArr.length:j,0,obj);

}

function renderProjectList(container, projects, grouped){

      buckets=keys.map(k=>[k==='—'?'no dataset':k,'var(--faint)',projects.filter(p=>(((p.dataset||'').trim())||'—')===k)]); }

function renderProgram(m){
  const sub = subMode==='status';   // status secondary pulls in all stages & drops the tail
  groupsIn(activeLab).forEach(g=>{ const all=projectsIn(activeLab,g.id).filter(matches);

  const looseAll=projectsIn(activeLab,'').filter(matches);
  const loose=sub?looseAll:looseAll.filter(isActive);
  if(loose.length) m.appendChild(renderNoProgram(loose));
  if(!sub) renderTail(m);

function renderNoProgram(loose){

function renderTail(m){

function renderSection(m,key,label,projects,drop){

function renderByField(m,field){

function renderGroup(g,ps){

function moveProject(srcId, beforeId, lab, group){
  const arr=DATA.projects; const si=arr.findIndex(p=>p.id===srcId); if(si<0)return; const src=arr[si];
  arr.splice(si,1);
  if(lab!==undefined)src.lab=lab; if(group!==undefined)src.group=group;
  const ti=beforeId?arr.findIndex(p=>p.id===beforeId):-1;
  if(ti<0)arr.push(src); else arr.splice(ti,0,src);
  dragId=null; queueSave(); render();
}
function renderRow(p){
  const frag=document.createDocumentFragment(); const isOpen=expanded.has(p.id);

  row.ondragend=()=>{ dragId=null; document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover')); };
  row.ondragover=e=>{ if(dragId&&dragId!==p.id){ e.preventDefault(); row.classList.add('dragover'); } };
  row.ondragleave=()=>row.classList.remove('dragover');
  row.ondrop=e=>{ e.preventDefault(); e.stopPropagation(); row.classList.remove('dragover'); if(dragId&&dragId!==p.id){
    const prog=groupMode==='program'; moveProject(dragId,p.id, prog?p.lab:undefined, prog?(p.group||''):undefined); } };
  const star=el('button','star'+(p.priority?' on':''),p.priority?'★':'☆');
  star.onclick=e=>{e.stopPropagation(); p.priority=p.priority?0:1; queueSave(); renderMain();}; row.appendChild(star);
  const main=el('div','rmain');

  nm.onclick=e=>{ e.stopPropagation(); row.draggable=false; const inp=el('input','rnameinput'); inp.value=p.name;
    nm.replaceWith(inp); inp.focus(); inp.select(); let done=false;
    const fin=()=>{ if(done)return; done=true; if(inp.value.trim())p.name=inp.value.trim(); queueSave(); renderMain(); };
    inp.onblur=fin; inp.onkeydown=ev=>{ ev.stopPropagation(); if(ev.key==='Enter')inp.blur(); if(ev.key==='Escape'){inp.value=p.name; inp.blur();} }; };
  main.appendChild(nm);
  const sub=el('div','rsub'); const st=stageOf(p); const jr=journalOf(p); const parts=[];
  if(p.authorship) parts.push(`<span>${AUTH_SHORT[p.authorship]}</span>`);
  if(jr) parts.push(`<span>${esc(jr)}</span>`);
  parts.push(`<span><span class="sdot" style="background:${STAGE_COLOR[st]}"></span>${STAGE_LBL[st]}</span>`);
  if(!parts.length && (p.posters||[]).length) parts.push(`<span>${(p.posters||[]).length} poster${p.posters.length>1?'s':''}</span>`);
  sub.innerHTML=parts.length?parts.join('<span class="sep">·</span>'):'<span style="color:var(--faint)">no details yet</span>';
  main.appendChild(sub); row.appendChild(main);
  const oc=openCount(p); row.appendChild(el('span','countbadge', oc?oc+' open':'✓'));
  row.appendChild(el('span','rcaret','▸'));
  let ct=null;
  row.onclick=()=>{ if(ct)return; ct=setTimeout(()=>{ ct=null; isOpen?expanded.delete(p.id):expanded.add(p.id); renderMain(); },200); };
  row.ondblclick=e=>{ if(ct){clearTimeout(ct);ct=null;} e.preventDefault(); e.stopPropagation(); showProjectMenu(p,e.clientX,e.clientY); };
  frag.appendChild(row); if(isOpen) frag.appendChild(renderDetail(p)); return frag;
}

function selValue(get,set,options,labelMap,opts={}){
  const span=el('span','editable'+(opts.pill?' pill':''));
  const paint=()=>{const v=get(); span.textContent=labelMap?(labelMap[v]||v||'—'):(v||'—'); span.classList.toggle('empty',!v);
    if(opts.pill){ const c=opts.color?opts.color(v):SC[v]; span.style.background=v?c:'transparent'; span.style.color=v?'#fff':''; }};
  paint();
  span.onclick=()=>{ const sel=el('select','inlinesel'); options.forEach(o=>sel.appendChild(optn(o,labelMap?(labelMap[o]||o||'—'):(o||'—')))); sel.value=get()||'';
    span.replaceWith(sel); sel.focus(); let done=false;
    const fin=()=>{ if(done)return; done=true; set(sel.value); queueSave(); renderMain(); };
    sel.onchange=fin; sel.onblur=fin; };
  return span;
}
function selectOrOther(get,set,baseList,ph){
  const span=el('span','editable'); const paint=()=>{const v=get(); span.textContent=v||ph||'—'; span.classList.toggle('empty',!v);}; paint();
  span.onclick=()=>{ const cur=get()||''; const opts=['',...baseList]; if(cur&&!opts.includes(cur))opts.push(cur); opts.push('__other__');
    const sel=el('select','inlinesel'); opts.forEach(o=>sel.appendChild(optn(o,o==='__other__'?'✎ Other…':(o||'—')))); sel.value=cur;
    span.replaceWith(sel); sel.focus(); let handled=false;
    const toInput=()=>{ const inp=el('input','inlineinput'); inp.value=cur; sel.replaceWith(inp); inp.focus(); let d=false;
      const f=()=>{ if(d)return; d=true; set(inp.value.trim()); queueSave(); renderMain(); };
      inp.onblur=f; inp.onkeydown=e=>{if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){inp.value=cur;inp.blur();}}; };
    sel.onchange=()=>{ handled=true; if(sel.value==='__other__')toInput(); else { set(sel.value); queueSave(); renderMain(); } };
    sel.onblur=()=>{ if(!handled)renderMain(); }; };
  return span;
}
function editText(get,set,opts={}){ const span=el('span','editable');
  const paint=()=>{const v=get(); span.textContent=v||opts.ph||'—'; span.classList.toggle('empty',!v);}; paint();
  span.onclick=()=>{ const area=opts.area; const inp=el(area?'textarea':'input','inlineinput'+(area?' inlinearea':''));
    inp.value=get()||''; if(!area) inp.size=Math.max(14,(get()||'').length+4); span.replaceWith(inp); inp.focus();
    let done=false; const fin=()=>{ if(done)return; done=true; set(inp.value.trim()); queueSave(); renderMain(); };
    inp.onblur=fin; inp.onkeydown=e=>{ if(e.key==='Enter'&&!area)inp.blur(); if(e.key==='Escape'){inp.value=get()||'';inp.blur();} }; };
  return span; }
function editRich(displayFn,get,set,opts={}){ const span=el('span','editable');
  const paint=()=>{ const h=displayFn(); span.innerHTML=h||('<i class="cv-empty">'+(opts.ph||'—')+'</i>'); span.classList.toggle('empty',!get()); }; paint();
  span.onclick=()=>{ const inp=el('textarea','inlineinput inlinearea'); inp.value=get()||''; span.replaceWith(inp); inp.focus();
    let done=false; const fin=()=>{ if(done)return; done=true; set(inp.value.trim()); queueSave(); renderMain(); };
    inp.onblur=fin; inp.onkeydown=e=>{ if(e.key==='Escape'){inp.value=get()||'';inp.blur();} }; };

  // WORK

    gSel.onchange=()=>{p.group=gSel.value; queueSave(); render();}; mf.appendChild(gSel); }
  mf.appendChild(el('span','k','dataset'));

  mf.appendChild(dsel);

  d.appendChild(mf);

const PRIO_COLOR={high:'var(--red)',med:'var(--amber)',low:'var(--blue)'};
function todayISO(){ return today()||new Date().toISOString().slice(0,10); }
function daysUntil(due){ if(!due)return null; return Math.round((new Date(due+'T00:00')-new Date(todayISO()+'T00:00'))/86400000); }
function dueMeta(due){ const n=daysUntil(due); if(n===null)return null; if(n<0)return{cls:'due-over',lbl:(-n)+'d late'}; if(n===0)return{cls:'due-soon',lbl:'today'}; if(n<=7)return{cls:'due-soon',lbl:'in '+n+'d'}; return{cls:'due-ok',lbl:due.slice(5)}; }
function prioChip(it){ return it.priority?el('span','prio prio-'+it.priority,PRIO_LBL[it.priority]):null; }
function mkTask(text){ return {id:'i'+Math.abs(hash((text||'')+(_pc++))),text:text||'',done:false,owner:'',date:today(),due:'',priority:'',notes:'',links:[],clerical:false,subtasks:[]}; }
function walkTasks(items,cb){ (items||[]).forEach(it=>{ cb(it); walkTasks(it.subtasks,cb); }); }
function dueCount(){ let n=0; (DATA&&DATA.projects||[]).forEach(p=>{ if(p.archived)return; Object.values(p.tracks).forEach(tr=>walkTasks(tr.items,it=>{ if(!it.done&&it.due){const d=daysUntil(it.due); if(d!==null&&d<=0)n++;} })); }); return n; }

function taskMeta(it){ const n=[]; if(it.clerical)n.push('⚙'); if((it.notes||'').trim())n.push('📝'); const st=it.subtasks||[]; if(st.length)n.push('☑'+st.filter(s=>s.done).length+'/'+st.length); const lk=(it.links||[]).length; if(lk)n.push('🔗'+lk); return n.join('  '); }
function renderTask(tr,it){ return renderTaskNode(tr.items,it,0); }
function renderTaskNode(list,it,depth){

  const body=el('div','body'); if(it.owner)body.appendChild(el('span','who',it.owner+' — ')); body.appendChild(document.createTextNode(it.text||''));
  const dm=dueMeta(it.due); if(dm)body.appendChild(el('span','duebadge '+dm.cls,dm.lbl));
  const mm=taskMeta(it); if(mm)body.appendChild(el('span','mini',mm)); row.appendChild(body);
  row.appendChild(el('span','tcaret'+(isO?' open':''),'▸'));
  const x=el('button','x','×'); x.onclick=e=>{e.stopPropagation(); const i=list.indexOf(it); if(i>=0)list.splice(i,1); expandedTasks.delete(it.id); queueSave(); renderMain();}; row.appendChild(x);
  row.onclick=()=>{ isO?expandedTasks.delete(it.id):expandedTasks.add(it.id); renderMain(); };
  wrap.appendChild(row);
  if(isO) wrap.appendChild(renderTaskDetail(list,it,depth));
  return wrap; }

    it.links.push({text:v,url:/^https?:\/\//i.test(v)?v:''}); li.value=''; queueSave(); renderMain(); }};
  lk.appendChild(li); d.appendChild(lk);

  else row.appendChild(el('span',null,l.text));
  const x=el('button','x','×'); x.onclick=()=>{it.links=it.links.filter(z=>z!==l); queueSave(); renderMain();}; row.appendChild(x); return row; }

let dueFilterMine=false;
function renderDue(m){
  DATA.inbox=DATA.inbox||[];                       // standalone quick-capture to-dos / reminders

  DATA.inbox.forEach(it=>{ if(!it.done) rows.push({it,inbox:true}); });

    const cb=el('input','duechk'); cb.type='checkbox'; cb.checked=!!r.it.done; cb.title='mark done';
    cb.onclick=e=>e.stopPropagation(); cb.onchange=()=>{ r.it.done=cb.checked; queueSave(); renderMain(); }; x.appendChild(cb);
    const pc=prioChip(r.it); if(pc&&!r.inbox)x.appendChild(pc);

    const open=expandedTasks.has(r.it.id);

    tw.appendChild(document.createTextNode((r.it.owner?r.it.owner+' — ':'')+r.it.text)); x.appendChild(tw);
    x.appendChild(el('span','dproj',r.p.name));

    wrap.appendChild(x);
    if(open){
      const ex=el('div','dueexp');

      const meta=el('div','dexp-meta');
      const mk=(lbl,node)=>{ const s=el('span','dexp-kv'); s.appendChild(el('span','dexp-k',lbl)); const v=el('span'); v.appendChild(node); s.appendChild(v); return s; };
      meta.appendChild(mk('Priority', selValue(()=>r.it.priority||'',v=>{r.it.priority=v;},['','high','med','low'],PRIO_LBL)));
      const dd=el('input','dduedate'); dd.type='date'; dd.value=r.it.due||''; dd.onchange=()=>{ r.it.due=dd.value; queueSave(); renderMain(); };
      meta.appendChild(mk('Due', dd));
      meta.appendChild(mk('Owner', editText(()=>r.it.owner||'',v=>{r.it.owner=v;},{ph:'who'})));
      ex.appendChild(meta);
      const subs=(r.it.subtasks||[]);
      if(subs.length){ const sl=el('div','dexp-subs'); subs.forEach(st=>{ const sr=el('div','dexp-sub');
        const scb=el('input'); scb.type='checkbox'; scb.checked=!!st.done; scb.onchange=()=>{ st.done=scb.checked; queueSave(); renderMain(); }; sr.appendChild(scb);
        sr.appendChild(el('span',st.done?'dexp-subdone':null,st.text)); sl.appendChild(sr); }); ex.appendChild(sl); }

      go.onclick=e=>{ e.stopPropagation(); activeLab=r.p.lab; labView='research'; render(); setTimeout(()=>{const el2=document.getElementById(r.p.id); el2&&el2.scrollIntoView({block:'center'});},60); };
      ex.appendChild(go);
      wrap.appendChild(ex);
    }
    return wrap; };
  const dated=rows.filter(r=>r.it.due).sort((a,b)=>a.it.due.localeCompare(b.it.due)), undated=rows.filter(r=>!r.it.due);
  const bk={over:[],today:[],week:[],later:[]};
  dated.forEach(r=>{ const n=daysUntil(r.it.due); if(n<0)bk.over.push(r); else if(n===0)bk.today.push(r); else if(n<=7)bk.week.push(r); else bk.later.push(r); });
  [['over','Overdue'],['today','Today'],['week','This week'],['later','Later']].forEach(([k,lbl])=>{ if(!bk[k].length)return; m.appendChild(el('div','duegroup',lbl+' · '+bk[k].length)); bk[k].forEach(r=>m.appendChild(mkrow(r))); });
  if(undated.length){
    m.appendChild(el('div','duegroup','No due date · '+undated.length));
    const inb=undated.filter(r=>r.inbox), proj=undated.filter(r=>!r.inbox);

    const byp=new Map(); proj.forEach(r=>{ if(!byp.has(r.p.id))byp.set(r.p.id,{p:r.p,items:[]}); byp.get(r.p.id).items.push(r); });
    byp.forEach(g=>{ m.appendChild(el('div','duesub',g.p.name+' · '+g.items.length));
      g.items.sort((a,b)=>PW[a.it.priority||'']-PW[b.it.priority||'']); g.items.forEach(r=>m.appendChild(mkrow(r))); });
  }
  if(!rows.length) m.appendChild(el('div','hint','Nothing open — jot a reminder above. 🎉'));

// Bold the CV owner wherever they appear in an author list. Name comes from
// profile.name, so the same app works for whoever owns the workspace.
function boldMe(s){
  const out=esc(s);
  const parts=myNameParts();
  if(parts.length<2) return out;
  const first=parts[0], last=parts[parts.length-1];
  const mid=parts.slice(1,-1).map(p=>p[0]).filter(c=>/[A-Za-z]/.test(c));
  //  "Jane Doe" · "Jane R. Doe" · "Jane Rose Doe"
  const full=new RegExp('('+rxEsc(first)+'(?:\\s+(?:[A-Z][a-z]+|[A-Z]\\.))?\\s+'+rxEsc(last)+')','g');
  //  "Doe J" · "Doe J." · "Doe JR" · "Doe, J.R."
  const inits=rxEsc(first[0])+'\\.?'+(mid.length?'(?:\\s*'+mid.map(c=>rxEsc(c)+'\\.?').join('\\s*')+')?':'');
  const abbrev=new RegExp('('+rxEsc(last)+',?\\s*'+inits+')','g');
  return out.replace(full,'<b>$1</b>').replace(abbrev,'<b>$1</b>');
}
// Latin / scientific terms that should be italicised anywhere they appear in CV prose.
const SCI_RE=new RegExp('(?<![A-Za-z])('+[
  'post[-\\s]?mortem','ante[-\\s]?mortem',
  'in[-\\s]+vivo','ex[-\\s]+vivo','in[-\\s]+vitro','in[-\\s]+situ','in[-\\s]+silico','in[-\\s]+utero','in[-\\s]+ovo',
  'in[-\\s]+toto','in[-\\s]+vacuo','in[-\\s]+extremis','in[-\\s]+extenso',
  'de[-\\s]+novo','per[-\\s]+se','a[-\\s]+priori','a[-\\s]+posteriori','ad[-\\s]+hoc',
  'sensu[-\\s]+stricto','sensu[-\\s]+lato','vice[-\\s]+versa'
].join('|')+')(?![A-Za-z])','gi');
function sciItalic(s){ return esc(s).replace(SCI_RE,'<i>$1</i>'); }
// editable field that displays Latin terms in italics but edits the raw plain text
function editSci(get,set,opts){ return editRich(()=>sciItalic(get()||''), get, set, opts||{}); }
const NAME_PARTICLES=new Set(['de','del','della','van','von','der','den','la','le','di','da','dos','das','st','st.','san','bin','al','ter','ten']);
function toAMA(name){
  name=(name||'').trim(); if(!name) return name;
  let mark=''; const mm=name.match(/[\*\^†#]+$/); if(mm){ mark=mm[0]; name=name.slice(0,-mark.length).trim(); }
  if(name.includes(',')){ const p=name.split(/,\s*/); const ini=((p[1]||'').match(/[A-Za-z]/g)||[]).join('').toUpperCase();
    return p[0].trim()+(ini?', '+ini:'')+mark; }
  const toks=name.split(/\s+/).filter(Boolean); if(toks.length<2) return name+mark;
  let i=toks.length-1; const sur=[toks[i]]; i--;
  while(i>=1 && NAME_PARTICLES.has(toks[i].toLowerCase().replace('.',''))){ sur.unshift(toks[i]); i--; }
  const ini=toks.slice(0,i+1).flatMap(g=>g.split('-')).map(x=>x[0]).filter(c=>/[A-Za-z]/.test(c)).join('').toUpperCase();
  return sur.join(' ')+(ini?', '+ini:'')+mark;
}
function abbrevAuthors(a){
  a=(a||'').replace(/\s*\(\d{4}\)\s*$/,'').trim(); if(!a) return a;
  if(a.includes('…')||a.includes('...')) return a.replace(/([A-Za-z])\./g,'$1');   // already abbreviated → just unify (drop initial periods)
  let parts=a.split(/,\s*/).map(s=>s.trim()).filter(Boolean).map(toAMA);
  if(parts.length<=3) return parts.join(', ');
  const last=parts.length-1;
  const mk=s=>(String(s).match(/[\*\^†#]+$/)||[''])[0];
  // co-senior: if the last two share an equal-contribution marker, show both as the tail
  let tail=parts[last], tailStart=last;
  if(mk(parts[last]) && parts[last-1] && mk(parts[last-1])===mk(parts[last])){ tail=parts[last-1]+' & '+parts[last]; tailStart=last-1; }
  const tailJoin=h=> h+', … '+(tail.includes(' & ')?tail:'& '+tail);
  const ki=parts.findIndex(p=>isMeName(p));
  if(ki<0) return tailJoin(parts[0]);
  if(tailStart-ki<=1) return parts.join(', ');                // I'm adjacent to the tail → show all
  if(ki<=6) return tailJoin(parts.slice(0,ki+1).join(', '));  // top 7 → list up to me
  return tailJoin(parts[0]+', … '+parts[ki]);                 // deep middle → first … me … & tail
}
function detectAuthorship(authors){
  const parts=authors.split(/;|,|\band\b|&/i).map(s=>s.trim()).filter(Boolean);
  const idx=parts.findIndex(a=>isMeName(a));
  if(idx<0) return '';
  const meStar=/\*/.test(parts[idx]||'');
  if(idx===0) return meStar?'co-first':'first';
  if(meStar && /\*/.test(parts[0]||'')) return 'co-first';
  if(idx===1) return 'second';
  if(idx===2) return 'third';
  return 'middle';
}

/* paste a paper / submission → match existing project or create new */
function parsePaper(text){
  const t=text.replace(/\s+/g,' ').trim();
  let journal='';
  for(const j of JOURNALS){ if(new RegExp('\\b'+j.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'\\b','i').test(t)){journal=j;break;} }
  if(!journal){ for(const k in JABBR){ if(new RegExp('(^|[^A-Za-z])'+JABBR[k].replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'([^A-Za-z]|$)','i').test(t)){journal=k;break;} } }
  let stage='manuscript-prep';
  if(/in press|accepted|published/i.test(t)) stage='accepted';
  else if(/under review|in review/i.test(t)) stage='in-review';
  else if(/in submission|submitted|resubmitted/i.test(t)) stage='in-submission';
  else if(/in prep|preparation/i.test(t)) stage='manuscript-prep';
  // title = the ". "-delimited segment with the most real words (fewest initials)
  const segs=t.split(/\.\s+/).map(s=>s.trim()).filter(Boolean);
  let title='', best=-1;
  segs.forEach(s=>{ const initials=(s.match(/\b[A-Z]\.?[A-Z]?\.?\b/g)||[]).length; const words=s.split(/\s+/).length;
    const score=words-initials*2+(s.length>45?4:0);
    if(words>=4 && score>best){ best=score; title=s; } });
  if(!title) title=(segs[0]||t).slice(0,90);
  title=title.replace(/^[\s,.;]+|[\s,.;]+$/g,'');
  let authors='';
  const ti=t.indexOf(title);
  if(ti>0){ authors=t.slice(0,ti).replace(/[\s.,;]+$/,'').trim(); }
  return {title,authors,journal,stage};
}
function scorePaperMatch(parsed,p){
  const pt=p.tracks.paper||{};
  const hay=(p.name+' '+(pt.full_title||'')+' '+(pt.authors||'')+' '+(p.tags||[]).join(' ')).toLowerCase();
  const toks=[...new Set((parsed.title||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3))];
  let sc=0; toks.forEach(t=>{ if(hay.includes(t)) sc+=1; });
  if(parsed.journal && pt.journal===parsed.journal) sc+=2;
  return sc;
}
function wirePaperPaste(){
  const ta=$('#paperText'), why=$('#paperWhy'), sel=$('#paperTarget'), fb=$('#paperFields');
  const mkField=(id,label,val,wide)=>{ const w=el('label','ppf'); w.appendChild(el('span','ppl',label));
    const i=el('input','tdinput'); i.id=id; i.value=val||''; if(wide)i.style.minWidth='320px'; w.appendChild(i); return w; };
  $('#paperMatch').onclick=()=>{
    const txt=ta.value.trim(); if(!txt){ why.textContent='(paste something first)'; return; }
    const parsed=parsePaper(txt);
    fb.style.display='flex'; fb.innerHTML='';
    fb.appendChild(mkField('ppTitle','Title',parsed.title,true));
    fb.appendChild(mkField('ppAuthors','Authors',parsed.authors,true));
    const jw=el('label','ppf'); jw.appendChild(el('span','ppl','Journal'));
    const js=el('select','tdinput'); js.id='ppJournal'; js.appendChild(optn('','—'));
    JOURNALS.forEach(j=>js.appendChild(optn(j,j))); if(parsed.journal&&!JOURNALS.includes(parsed.journal))js.appendChild(optn(parsed.journal,parsed.journal));
    js.value=parsed.journal||''; jw.appendChild(js); fb.appendChild(jw);
    const sw=el('label','ppf'); sw.appendChild(el('span','ppl','Stage'));
    const ss=el('select','tdinput'); ss.id='ppStage'; STAGE_ORDER.forEach(s=>ss.appendChild(optn(s,STAGE_LBL[s]))); ss.value=parsed.stage; sw.appendChild(ss); fb.appendChild(sw);
    // build match dropdown
    sel.innerHTML=''; sel.appendChild(optn('__new__','＋ Create new project'));
    const ranked=projectsIn(activeLab).map(p=>({p,s:scorePaperMatch(parsed,p)})).sort((a,b)=>b.s-a.s);
    ranked.forEach(({p,s})=>sel.appendChild(optn(p.id,(s>0?'('+s+') ':'')+p.name)));
    const top=ranked[0];
    if(top && top.s>=3){ sel.value=top.p.id; why.textContent='best match: '+top.p.name+' — review fields, then Add / Update'; }
    else { sel.value='__new__'; why.textContent='no strong match — will create a new project'; }
  };
  $('#paperApply').onclick=()=>{
    if(!$('#ppTitle')){ $('#paperMatch').onclick(); return; }
    const title=$('#ppTitle').value.trim(), authors=$('#ppAuthors').value.trim(),
          journal=$('#ppJournal').value, stage=$('#ppStage').value;
    if(!title){ why.textContent='need a title'; return; }
    const tgt=sel.value;
    if(tgt==='__new__'){
      const id=slug(title)+'-'+Math.abs(hash(title+(_pc++))).toString(36).slice(0,4);
      const tracks={paper:{status:'',items:[],journal,full_title:title,authors,pubinfo:''}}; WORK.forEach(w=>tracks[w]={status:'',items:[]});
      DATA.projects.push({id,name:title.slice(0,60),lab:activeLab,group:'',priority:0,stage,authorship:'',dataset:'',pi:[],dirs:[],tags:[],posters:[],tracks});
      expanded.add(id); why.textContent='✓ created new project "'+title.slice(0,40)+'"';
    } else {
      const p=DATA.projects.find(x=>x.id===tgt); if(!p){ why.textContent='pick a target'; return; }
      const pt=p.tracks.paper||(p.tracks.paper={status:'',items:[]});
      if(title)pt.full_title=title; if(authors)pt.authors=authors; if(journal)pt.journal=journal; if(stage)p.stage=stage;
      expanded.add(p.id); why.textContent='✓ updated "'+p.name+'"';
    }
    ta.value=''; fb.style.display='none'; fb.innerHTML=''; queueSave(); render();
  };
}

/* new project */
function openNewProj(){ $('#npName').value=''; $('#npPI').value=''; const nl=$('#npLab'); nl.innerHTML='';
  DATA.labs.forEach(l=>nl.appendChild(optn(l,l))); nl.value=activeLab; fillNpG(); nl.onchange=fillNpG; $('#newProjDlg').showModal(); }
function fillNpG(){ const g=$('#npGroup'); g.innerHTML=''; g.appendChild(optn('','— no group —'));
  DATA.groups.filter(x=>x.lab===$('#npLab').value).forEach(gr=>g.appendChild(optn(gr.id,gr.name))); }
$('#newProjDlg').addEventListener('close',()=>{ if($('#newProjDlg').returnValue!=='ok')return;
  const name=$('#npName').value.trim(); if(!name)return; const id=slug(name)+'-'+Math.abs(hash(name+(_pc++))).toString(36).slice(0,4);
  const tracks={paper:{status:'',items:[],journal:''}}; WORK.forEach(t=>tracks[t]={status:'',items:[]});
  DATA.projects.push({id,name,lab:$('#npLab').value,group:$('#npGroup').value,priority:0,stage:'idea',authorship:'',dataset:'',
    pi:$('#npPI').value.trim()?[$('#npPI').value.trim()]:[],dirs:[],tags:[],posters:[],tracks});
  activeLab=$('#npLab').value; expanded.add(id); queueSave(); render(); });

/* ---------- ✨ Update Assistant (Claude-powered) ---------- */
function renderAssistant(m){
  const h=el('div','lhead'); h.innerHTML='<h1>✨ Update Assistant</h1><div class="stats"><span>Connect Gmail for automatic updates, or paste anything. Claude routes it to the right project and proposes changes for your approval.</span></div>'; m.appendChild(h);
  const keyBox=el('div','asst-key'); m.appendChild(keyBox);
  const emailBox=el('div','asst-key'); m.appendChild(emailBox); renderEmailSetup(emailBox);
  const slackBox=el('div','asst-key'); m.appendChild(slackBox); renderSlackSetup(slackBox);
  const pendingBox=el('div','asst-results'); m.appendChild(pendingBox); renderPending(pendingBox);
  m.appendChild(el('div','asst-divider','— or paste an update manually —'));
  const ta=el('textarea','tdarea'); ta.placeholder='Paste an email, Slack thread, or note about any project…'; ta.style.minHeight='120px'; m.appendChild(ta);
  const bar=el('div','prow'); bar.style.margin='8px 0'; const analyze=el('button','btn','Analyze →'); const why=el('span','hint'); bar.appendChild(analyze); bar.appendChild(why); m.appendChild(bar);
  const results=el('div','asst-results'); m.appendChild(results);
  fetch('/api/config').then(r=>r.json()).then(cfg=>{
    if(!cfg.hasKey){ renderKeySetup(keyBox); analyze.disabled=true; }
    else { keyBox.innerHTML=''; const line=el('div','hint','✓ Claude API key set ('+cfg.model+') · '); const a=el('a',null,'change'); a.href='#'; a.onclick=e=>{e.preventDefault(); renderKeySetup(keyBox); analyze.disabled=true;}; line.appendChild(a); keyBox.appendChild(line); }
  }).catch(()=>{ keyBox.innerHTML='<div class="hint">could not reach server</div>'; });
  analyze.onclick=async()=>{
    const update=ta.value.trim(); if(!update){ why.textContent='(paste something first)'; return; }
    why.textContent='thinking…'; results.innerHTML=''; analyze.disabled=true;
    try{
      const r=await fetch('/api/llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({update})});
      const j=await r.json();
      if(j.error){ why.textContent = j.error==='no_key'?'Set your API key first ↑':('error: '+j.error); return; }
      why.textContent=''; renderSuggestions(results, j.matches||[]);
    }catch(e){ why.textContent='error: '+e.message; }
    finally{ analyze.disabled=false; }
  };
}
function renderEmailSetup(box){
  box.innerHTML='<div class="hint">loading email settings…</div>';
  fetch('/api/config').then(r=>r.json()).then(cfg=>{
    box.innerHTML=''; const det=el('details','paste'); det.open=!cfg.hasEmail&&cfg.hasKey?false:false;
    const sum=el('summary'); sum.textContent=cfg.hasEmail?('📧 Email connected — '+cfg.gmail_address+(cfg.email_poll?' · auto-checking every 10 min':' · auto-check OFF')):'📧 Connect email (IMAP) — auto-generate updates from new mail';
    det.appendChild(sum); const body=el('div','body'); det.appendChild(body);
    const row=(l,c)=>{const r=el('div','kvrow');r.appendChild(el('span','k',l));const v=el('span','v');v.appendChild(c);r.appendChild(v);return r;};
    const addr=el('input','tdinput'); addr.value=cfg.gmail_address||''; addr.placeholder='you@gmail.com'; addr.oninput=()=>{server.placeholder=(/@/.test(addr.value)?'':'')+(cfg.imap_guess||'imap.gmail.com');};
    const pw=el('input','tdinput'); pw.type='password'; pw.placeholder=cfg.hasEmail?'•••• (set — blank keeps it)':'app password';
    const server=el('input','tdinput'); server.value=cfg.imap_server||''; server.placeholder=(cfg.imap_guess||'imap.gmail.com')+' (auto)';
    const senders=el('input','tdinput'); senders.value=(cfg.email_senders||[]).join(', '); senders.placeholder='optional: only these senders (comma-sep); blank = all';
    const poll=el('input'); poll.type='checkbox'; poll.checked=!!cfg.email_poll;
    body.appendChild(row('Email', addr)); body.appendChild(row('App password', pw)); body.appendChild(row('IMAP server', server)); body.appendChild(row('Senders', senders));
    const pl=el('label','tdflag'); pl.appendChild(poll); pl.appendChild(el('span',null,'Auto-check inbox every 10 min')); body.appendChild(row('Auto', pl));
    body.appendChild(el('div','hint','Gmail/Google-Workspace works with an app password (Google Account → Security → 2-Step Verification → App passwords). ⚠️ Outlook/Microsoft 365 & most university accounts (incl. @pennmedicine.upenn.edu) block basic-auth IMAP — use a Gmail/Google account or forward mail there. IMAP server auto-detects from the domain; override above if needed. Email bodies are sent to the Claude API.'));
    const abar=el('div','prow'); abar.style.marginTop='6px';
    const save=el('button','btn sm','Save'); const why=el('span','hint');
    save.onclick=async()=>{ save.textContent='saving…';
      const payload={gmail_address:addr.value.trim(), imap_server:server.value.trim(), email_senders:senders.value, email_poll:poll.checked};
      if(pw.value.trim())payload.gmail_app_password=pw.value.trim();
      try{ await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); renderEmailSetup(box); }
      catch(e){ save.textContent='Save'; } };
    const check=el('button','btn sm ghost','Check now');
    check.onclick=async()=>{ check.textContent='checking…';
      try{ const r=await fetch('/api/email/check',{method:'POST'}); const j=await r.json();
        why.textContent=j.error?('✕ '+j.error):('✓ '+j.added+' new suggestion'+(j.added===1?'':'s')); render(); }
      catch(e){ why.textContent='error'; } finally{ check.textContent='Check now'; } };
    abar.appendChild(save); abar.appendChild(check); abar.appendChild(why); body.appendChild(abar);
    box.appendChild(det);
  }).catch(()=>{ box.innerHTML='<div class="hint">could not load email settings</div>'; });
}

    box.innerHTML=''; const det=el('details','paste');
    const sum=el('summary'); sum.textContent=cfg.hasSlack?('💬 Slack connected'+(cfg.slack_poll?' · auto-checking every 10 min':' · auto-check OFF')):'💬 Connect Slack — auto-generate updates from messages';
    det.appendChild(sum); const body=el('div','body'); det.appendChild(body);

      if(tok.value.trim())payload.slack_token=tok.value.trim();
      try{ await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); renderSlackSetup(box); }
      catch(e){ save.textContent='Save'; } };
    const check=el('button','btn sm ghost','Check now');
    check.onclick=async()=>{ check.textContent='checking…';
      try{ const r=await fetch('/api/slack/check',{method:'POST'}); const j=await r.json();
        why.textContent=j.error?('✕ '+j.error):('✓ '+j.added+' new suggestion'+(j.added===1?'':'s')); render(); }
      catch(e){ why.textContent='error'; } finally{ check.textContent='Check now'; } };
    abar.appendChild(save); abar.appendChild(check); abar.appendChild(why); body.appendChild(abar);
    box.appendChild(det);
  }).catch(()=>{ box.innerHTML='<div class="hint">could not load Slack settings</div>'; });

function changeLabel(ch){
  return ch.type==='update_stage'?('Set stage → '+(STAGE_LBL[ch.stage]||ch.stage))
       : ch.type==='flag'?('⚑ Follow-up: '+(ch.text||''))
       : ch.type==='add_note'?('Note: '+(ch.text||''))
       : ('+ '+(ch.track||'task')+' · '+(ch.text||''));
}
function renderPending(box){
  box.innerHTML='<div class="hint">loading pending…</div>';
  fetch('/api/pending').then(r=>r.json()).then(items=>{
    box.innerHTML='';
    if(!items.length){ return; }
    box.appendChild(el('div','asst-cardtitle','📥 Pending ('+items.length+')'));
    items.forEach(item=>{
      const card=el('div','asst-card');
      card.appendChild(el('div','asst-cardtitle',(item.source==='slack'?'💬 ':'✉️ ')+(item.subject||'(no subject)')));
      card.appendChild(el('div','hint','from '+(item.from||'')+(item.date?' · '+item.date:'')));
      const chs=[];
      (item.matches||[]).forEach(mt=>{
        card.appendChild(el('div','asst-match',(mt.project_id==='NEW'?'＋ New project — ':'→ ')+(mt.project_name||mt.project_id)+' ('+(mt.confidence||'')+')'));
        if(mt.summary)card.appendChild(el('div','hint',mt.summary));
        (mt.changes||[]).forEach(ch=>{ const r=el('label','asst-change'); const cb=el('input');cb.type='checkbox';cb.checked=true;r.appendChild(cb);
          r.appendChild(el('span',null,changeLabel(ch))); card.appendChild(r); chs.push({cb,ch,mt}); });
      });
      const bar=el('div','prow'); bar.style.marginTop='6px';
      const ap=el('button','btn sm','Approve'); ap.onclick=async()=>{ ap.disabled=true;
        const byMt=new Map(); chs.filter(x=>x.cb.checked).forEach(x=>{ if(!byMt.has(x.mt))byMt.set(x.mt,[]); byMt.get(x.mt).push(x.ch); });
        byMt.forEach((cc,mt)=>applyLLM(mt,cc));
        await fetch('/api/pending/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});
        renderSide(); renderPending(box); };
      const dm=el('button','btn sm ghost','Dismiss'); dm.onclick=async()=>{
        await fetch('/api/pending/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})}); renderSide(); renderPending(box); };
      bar.appendChild(ap); bar.appendChild(dm); card.appendChild(bar); box.appendChild(card);
    });
  }).catch(()=>{ box.innerHTML=''; });
}

  box.innerHTML='';
  box.appendChild(el('div','hint','Enter your Anthropic API key — stored locally in data/config.json (server-side, chmod 600); it is never kept in the browser after this.'));
  const inp=el('input','tdinput'); inp.type='password'; inp.placeholder='sk-ant-…'; inp.style.minWidth='300px';
  const save=el('button','btn sm','Save key');
  save.onclick=async()=>{ if(!inp.value.trim())return; save.textContent='saving…';
    try{ const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({anthropic_api_key:inp.value.trim()})});
      const j=await r.json(); if(j.hasKey){ renderMain(); } else { save.textContent='Save key'; } }
    catch(e){ save.textContent='Save key'; } };
  const row=el('div','prow'); row.style.marginTop='6px'; row.appendChild(inp); row.appendChild(save); box.appendChild(row);
}
function renderSuggestions(container, matches){
  container.innerHTML='';
  if(!matches.length){ container.appendChild(el('div','cv-none','No changes suggested for this update.')); return; }
  matches.forEach(mt=>{
    const card=el('div','asst-card'); const isNew=mt.project_id==='NEW';
    const t=el('div','asst-cardtitle'); t.textContent=(isNew?'＋ New project — ':'')+(mt.project_name||mt.project_id);
    const conf=el('span','asst-conf',' '+(mt.confidence||'')+' confidence'); t.appendChild(conf); card.appendChild(t);
    if(mt.summary) card.appendChild(el('div','hint',mt.summary));
    const chs=[];
    (mt.changes||[]).forEach(ch=>{
      const row=el('label','asst-change'); const cb=el('input'); cb.type='checkbox'; cb.checked=true; row.appendChild(cb);
      row.appendChild(el('span',null,changeLabel(ch))); card.appendChild(row); chs.push({cb,ch});
    });
    const ab=el('button','btn sm','Apply approved');
    ab.onclick=()=>{ applyLLM(mt, chs.filter(x=>x.cb.checked).map(x=>x.ch)); ab.textContent='✓ applied to '+(mt.project_name||'project'); ab.disabled=true; };
    card.appendChild(ab); container.appendChild(card);
  });
}
function applyLLM(mt, changes){
  const realLabs=DATA.labs.filter(l=>!CV_SECTIONS.includes(l)&&l!=='__cv__'&&l!=='__assistant__');
  let p = mt.project_id==='NEW' ? null : DATA.projects.find(x=>x.id===mt.project_id);
  if(!p){ const name=mt.project_name||'New project'; const lab=realLabs.includes(mt.lab)?mt.lab:realLabs[0];
    const id=slug(name)+'-'+Math.abs(hash(name+(_pc++))).toString(36).slice(0,4);
    const tracks={paper:{status:'',items:[]}}; WORK.forEach(w=>tracks[w]={status:'',items:[]});
    p={id,name,lab,group:'',priority:0,stage:'idea',authorship:'',dataset:'',pi:[],dirs:[],tags:[],posters:[],tracks};
    DATA.projects.push(p); expanded.add(id);
  }
  changes.forEach(ch=>{
    if(ch.type==='update_stage'&&ch.stage&&STAGE_ORDER.includes(ch.stage)){ p.stage=ch.stage; return; }
    const tr=(ch.track&&['paper',...WORK].includes(ch.track))?ch.track:'analysis';
    p.tracks[tr]=p.tracks[tr]||{status:'',items:[]};
    addItem(p.tracks[tr], (ch.type==='flag'?'⚑ ':'')+(ch.text||''));
    if(ch.type==='flag'){ const its=p.tracks[tr].items; its[its.length-1].hp=true; its[its.length-1].priority='high'; }
  });
  activeLab=p.lab; queueSave();
}

/* save + utils */
function queueSave(){ const b=$('#savebadge'); if(b){b.className='savebadge dirty'; b.textContent='unsaved…';} clearTimeout(saveTimer); saveTimer=setTimeout(save,600); }
async function save(){ const b=$('#savebadge');
  try{ const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Mtime':dataMtime||''},body:JSON.stringify(DATA)});
    if(r.status===409){ if(b){b.className='savebadge err'; b.textContent='newer data — reloaded';} await reloadFresh(); return; }
    const j=await r.json();
    if(j.ok){DATA.updated=j.updated; dataMtime=j.mtime; if(b){b.className='savebadge ok'; b.textContent='saved '+j.updated;}} else throw new Error(j.error); }
  catch(e){ if(b){b.className='savebadge err'; b.textContent='save error';} console.error(e); } }
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h<<5)-h+s.charCodeAt(i)|0;return h;}
let _pc=0; function today(){return DATA&&DATA.updated?String(DATA.updated).slice(0,10):'';}
